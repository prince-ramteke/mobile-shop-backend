# Local dev profile: run with in-memory H2, no MySQL or env vars needed.
#   Run:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# This profile is NOT used in production (which runs the default profile with
# SPRING_DATASOURCE_* / JWT_SECRET env vars). Safe to commit.

# H2 in-memory accepts any credentials for a fresh DB — do NOT put real DB
# passwords here (this file is committed). 'sa' / blank is the H2 convention.
spring.datasource.url=jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Dev-only JWT secret so JWT_SECRET env var isn't required locally.
jwt.secret=etdrfthwertyhdfgnhgfhfddhydjdttyhthdththddff
jwt.expiration=86400000

# Keep local runs quiet/safe.
spring.task.scheduling.enabled=false
whatsapp.enabled=false