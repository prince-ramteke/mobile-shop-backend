spring.application.name=mobile-shop-backend

# Lazy startup: beans are created on first use, so the app boots fast and with a
# low memory footprint (important on 512MB free tiers). The @Scheduled reminder
# bean is kept eager via @Lazy(false) so it still runs.
spring.main.lazy-initialization=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.task.scheduling.enabled=true

reminder.gap.days=3

whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.provider=meta
whatsapp.sender-number=${WHATSAPP_SENDER_NUMBER:}
whatsapp.api-key=${WHATSAPP_API_KEY:}

# WhatsApp Cloud (Meta) API — set these + WHATSAPP_ENABLED=true to enable real sending
whatsapp.api.base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v20.0}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.token=${WHATSAPP_API_TOKEN:}

# Swagger disabled by default to save memory/startup time on the free tier.
# Set SWAGGER_ENABLED=true to turn the API docs UI back on.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${PORT:8080}

# Quiet SQL logging (DEBUG/TRACE of every query + bind param was heavy and noisy).
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never